<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>영화 티켓 예매</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <h1>영화 티켓 예매</h1>
          <p id="sessionText">로그인 후 좌석을 선택해 예매하세요.</p>
        </div>
        <button id="logoutButton" class="ghost hidden" type="button">로그아웃</button>
      </section>

      <section class="layout">
        <div class="panel auth-panel">
          <div class="tabs" role="tablist" aria-label="인증 방식">
            <button id="loginTab" class="tab active" type="button">로그인</button>
            <button id="registerTab" class="tab" type="button">회원가입</button>
          </div>

          <form id="authForm" class="form">
            <label>
              이름
              <input id="nameInput" name="name" type="text" autocomplete="name" placeholder="회원가입 시 입력">
            </label>
            <label>
              이메일
              <input id="emailInput" name="email" type="email" autocomplete="email" required placeholder="user@example.com">
            </label>
            <label>
              비밀번호
              <input id="passwordInput" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="8자 이상">
            </label>
            <button id="authSubmit" type="submit">로그인</button>
          </form>
        </div>

        <div class="workspace">
          <section class="panel">
            <div class="section-head">
              <h2>영화</h2>
              <button id="refreshButton" class="ghost" type="button">새로고침</button>
            </div>
            <div id="movieList" class="movie-list"></div>
          </section>

          <section class="panel">
            <div class="section-head">
              <h2>상영 시간</h2>
              <span id="selectedMovieText" class="muted">영화를 선택하세요.</span>
            </div>
            <div id="showtimeList" class="showtime-list"></div>
          </section>

          <section class="panel booking-panel">
            <div class="section-head">
              <h2>좌석</h2>
              <span id="selectedShowtimeText" class="muted">상영 시간을 선택하세요.</span>
            </div>
            <div class="screen">SCREEN</div>
            <div id="seatGrid" class="seat-grid"></div>
            <button id="bookButton" type="button" disabled>선택 좌석 예매</button>
          </section>

          <section class="panel">
            <div class="section-head">
              <h2>내 예매</h2>
              <button id="bookingRefreshButton" class="ghost" type="button">조회</button>
            </div>
            <div id="bookingList" class="booking-list"></div>
          </section>
        </div>
      </section>

      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
